<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Tracker</title>
  <link rel="stylesheet" href="styles/popup.css" />
</head>
<body>
  <header>
    <span class="logo">◈ Job Tracker</span>
  </header>

  <main>
    <!-- Estado inicial -->
    <div id="view-idle">
      <p class="hint">Abre <strong>LinkedIn Jobs</strong> y busca con tu string optimizado. Luego extrae.</p>
      <button id="btn-extract" class="btn-primary">Extraer ofertas</button>
    </div>

    <!-- Progreso -->
    <div id="view-progress" class="hidden">
      <p class="status-label">Extrayendo<span class="dots">...</span></p>
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
      <p id="progress-text" class="counter">0 / 0</p>
    </div>

    <!-- Resultado -->
    <div id="view-result" class="hidden">
      <p class="result-count"><span id="result-number">0</span> ofertas extraídas</p>
      <p id="result-filename" class="filename"></p>
      <button id="btn-again" class="btn-secondary">Extraer de nuevo</button>
    </div>

    <!-- Error -->
    <div id="view-error" class="hidden">
      <p class="error-msg" id="error-text"></p>
      <button id="btn-retry" class="btn-secondary">Reintentar</button>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
