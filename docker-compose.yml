services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RAW_DATA_PATH: /app/raw_data
      FILTRADAS_PATH: /app/filtradas/filtradas.json
      DATABASE_URL: /app/data/job_tracker.db
    volumes:
      - ${RAW_DATA_HOST_PATH:-./raw_data}:/app/raw_data
      - ./filtradas:/app/filtradas
      - db_data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  db_data:
